{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log out</title><link rel="stylesheet" href="{% static 'css/auth.css' %}"></head>
<body><main class="auth-shell"><aside class="auth-brand"><a class="brand-logo" href="{% url 'home' %}"><span class="brand-mark">T</span><span>Tally</span></a><div class="brand-copy"><p class="eyebrow">See you soon</p><h2>Taking a break?</h2><p>You can come back any time. Your account and work will be here when you return.</p></div><p class="brand-footer">Simple tools for independent people.</p></aside><section class="auth-main"><div class="auth-card logout-card"><h1>Log out?</h1><p class="subtitle">Are you sure you want to sign out?</p><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="primary-button" type="submit">Log out</button></form><p class="auth-switch"><a href="{% url 'home' %}">Stay signed in</a></p></div></section></main></body></html>
